<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilot Home — AgentTraining.ai</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="pilot-cloud.js"></script>
<style>
:root{--blue:#1a56db;--ink:#111827;--muted:#64748b;--bg:#f7f8fc;--line:#e2e8f0;--green:#047857;--amber:#b45309;--red:#b91c1c;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}nav{height:64px;padding:0 5%;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{color:var(--blue);font-size:20px;font-weight:800;text-decoration:none}.logo span{color:#f59e0b}.nav-right{display:flex;align-items:center;gap:10px}.identity{color:var(--muted);font-size:11px}.signout{border:1px solid var(--line);background:#fff;color:#475569;border-radius:8px;padding:7px 10px;cursor:pointer}.hero{padding:38px 5%;background:linear-gradient(135deg,#eff6ff 0%,#ecfdf5 100%)}.hero-inner{max-width:1180px;margin:auto}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.hero h1{font-size:36px;margin:8px 0}.hero p{color:var(--muted);line-height:1.55;margin:0;max-width:720px}.role{display:inline-block;margin-top:13px;padding:6px 10px;border-radius:99px;background:#fff;color:#1d4ed8;font-size:11px;font-weight:800;border:1px solid #bfdbfe}.shell{max-width:1180px;margin:24px auto;padding:0 18px}.status{background:#fff;border:1px dashed var(--line);border-radius:13px;padding:36px;text-align:center;color:var(--muted)}.next{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.next-label{font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.6px}.next h2{font-size:23px;margin:6px 0}.next p{margin:0;color:var(--muted);line-height:1.5}.primary{display:inline-block;white-space:nowrap;text-decoration:none;background:var(--blue);color:#fff;padding:12px 17px;border-radius:10px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.metric strong{display:block;font-size:27px;color:var(--blue);margin-bottom:4px}.metric span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.panel h2{font-size:18px;margin:0 0 14px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:14px}.step b{display:block;color:var(--blue);margin-bottom:6px}.step p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.actions{display:grid;gap:9px}.action{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}.action:hover{border-color:#93c5fd;background:#eff6ff}.action small{display:block;color:var(--muted);margin-top:3px}.arrow{color:var(--blue);font-weight:800}.result{background:#f8fafc;border-radius:10px;padding:13px;line-height:1.5}.result b{display:block;margin-bottom:4px}.result small{color:var(--muted)}.trust{margin-top:18px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;color:#065f46;font-size:12px;line-height:1.55}.empty{color:var(--muted);background:#f8fafc;border-radius:10px;padding:15px}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.next{align-items:flex-start;flex-direction:column}.hero h1{font-size:29px}.primary{width:100%;text-align:center}.identity{display:none}}@media(max-width:450px){.metrics{grid-template-columns:1fr}.hero{padding:28px 5%}.shell{padding:0 12px}}
</style>
</head>
<body>
<nav><a class="logo" href="index.html">AgentTraining<span>.AI</span></a><div class="nav-right"><span class="identity" id="identity">Secure Pilot</span><button class="signout" id="signout" type="button">Sign out</button></div></nav>
<header class="hero"><div class="hero-inner"><div class="eyebrow">Secure Pilot Workspace</div><h1 id="welcome">Welcome to your Pilot Home</h1><p id="subtitle">One clear place to see what matters now and where to go next.</p><span class="role" id="roleBadge">Loading role…</span></div></header>
<main class="shell" id="app"><div class="status">Loading your secure workspace…</div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const active=a=>(a||[]).filter(x=>x.status!=='Completed');
function managerView(me,assignments,sessions,profiles){
  const open=active(assignments),completed=(assignments||[]).filter(x=>x.status==='Completed'),recent=sessions?.[0];
  const attention=(profiles||[]).filter(p=>(p.claims||[]).some(c=>c.status==='active'&&c.claimType==='growth_area')).length;
  const next=open.length?{title:'Review active assignments',text:`${open.length} assignment${open.length===1?' is':'s are'} waiting for learner action or completion.`,href:'manager.html?pilot=1'}:{title:'Ask Manager AI about one member',text:'Review evidence, understand a coaching need, and confirm one targeted Practice.',href:'manager-chat.html?pilot=1'};
  return `<section class="next"><div><div class="next-label">Your next action</div><h2>${esc(next.title)}</h2><p>${esc(next.text)}</p></div><a class="primary" href="${next.href}">Continue</a></section>
  <section class="metrics"><div class="metric"><strong>${profiles.length}</strong><span>Team members with evidence</span></div><div class="metric"><strong>${open.length}</strong><span>Active assignments</span></div><div class="metric"><strong>${completed.length}</strong><span>Completed assignments</span></div><div class="metric"><strong>${attention}</strong><span>Members with a coaching focus</span></div></section>
  <section class="grid"><div class="panel"><h2>How to run the training loop</h2><div class="steps"><div class="step"><b>1 · Understand</b><p>Use Manager AI to inspect authorized evidence—not private learner conversations.</p></div><div class="step"><b>2 · Confirm</b><p>Review the suggested Practice and confirm it before anything is sent.</p></div><div class="step"><b>3 · Coach</b><p>Track completion, transcript, score, and follow-up evidence.</p></div></div>${recent?`<div class="result" style="margin-top:13px"><b>Latest team result: ${esc(recent.scenario)}</b><small>${esc(recent.learnerName||recent.learner)} · ${esc(recent.scores?.overall||0)}/100 · ${esc(new Date(recent.savedAt).toLocaleDateString())}</small></div>`:''}</div>
  <div class="panel"><h2>Manager workspace</h2><div class="actions"><a class="action" href="manager-chat.html?pilot=1"><span><b>Manager AI</b><small>Evidence-based member coaching</small></span><span class="arrow">→</span></a><a class="action" href="manager.html?pilot=1"><span><b>Manager Studio</b><small>Assignments, results and transcripts</small></span><span class="arrow">→</span></a><a class="action" href="learner-profile.html?pilot=1"><span><b>Learner Profiles</b><small>Claims, evidence and confidence</small></span><span class="arrow">→</span></a><a class="action" href="knowledge.html?pilot=1"><span><b>Company Knowledge</b><small>Analyze, approve and convert training material</small></span><span class="arrow">→</span></a></div></div></section>`;
}
function learnerView(me,assignments,sessions,profiles){
  const open=active(assignments),next=open[0],recent=sessions?.[0],profile=profiles?.[0];
  const nextBlock=next?{title:next.scenarioName,text:`${next.mode||'standard'} Practice · ${next.status}`,href:`simulator.html?ref=demo&pilot=1&assignment=${encodeURIComponent(next.id)}`,label:'Start assigned Practice'}:{title:'Ask your Personal AI Coach',text:'There is no active assignment. Review your evidence and decide what to strengthen next.',href:'coach-chat.html?pilot=1',label:'Open My Coach'};
  const claims=(profile?.claims||[]).filter(c=>c.status==='active');
  return `<section class="next"><div><div class="next-label">Your next action</div><h2>${esc(nextBlock.title)}</h2><p>${esc(nextBlock.text)}</p></div><a class="primary" href="${nextBlock.href}">${esc(nextBlock.label)}</a></section>
  <section class="metrics"><div class="metric"><strong>${open.length}</strong><span>Active assignments</span></div><div class="metric"><strong>${sessions.length}</strong><span>Completed Practice sessions</span></div><div class="metric"><strong>${recent?esc(recent.scores?.overall||0):'—'}</strong><span>Latest overall score</span></div><div class="metric"><strong>${claims.length}</strong><span>Current evidence claims</span></div></section>
  <section class="grid"><div class="panel"><h2>How your learning loop works</h2><div class="steps"><div class="step"><b>1 · Receive</b><p>Your confirmed assignment appears here and in your private Coach Chat.</p></div><div class="step"><b>2 · Practice</b><p>Complete the conversation and receive a score, transcript and Coach Summary.</p></div><div class="step"><b>3 · Improve</b><p>Your evidence and next coaching focus update automatically.</p></div></div>${recent?`<div class="result" style="margin-top:13px"><b>Latest result: ${esc(recent.scenario)}</b><small>${esc(recent.scores?.overall||0)}/100 · ${esc(new Date(recent.savedAt).toLocaleDateString())}</small></div>`:''}</div>
  <div class="panel"><h2>Your workspace</h2><div class="actions"><a class="action" href="coach-chat.html?pilot=1"><span><b>My Personal AI Coach</b><small>Private coaching and Assignment Inbox</small></span><span class="arrow">→</span></a><a class="action" href="learner-profile.html?pilot=1"><span><b>My Success Profile</b><small>Evidence, confidence and correction</small></span><span class="arrow">→</span></a><a class="action" href="simulator.html?ref=demo&pilot=1"><span><b>Practice Studio</b><small>Explore curriculum and practice</small></span><span class="arrow">→</span></a><a class="action" href="knowledge.html?pilot=1"><span><b>Company Knowledge</b><small>Manager-approved training knowledge</small></span><span class="arrow">→</span></a></div></div></section>`;
}
async function loadHome(){
  if(!PilotCloud.enabled){location.replace('pilot.html?pilot=1');return}
  try{
    const me=await PilotCloud.request('me');const isManager=(me.roles||[]).some(r=>r==='manager'||r==='admin');
    const opts=isManager?{requiredRole:'manager'}:{};
    const [assignmentData,sessionData,profileData]=await Promise.all([PilotCloud.request('assignments',opts),PilotCloud.request('sessions',opts),PilotCloud.request('profiles',opts)]);
    document.getElementById('identity').textContent=me.email;document.getElementById('roleBadge').textContent=isManager?'Manager Pilot':'Learner Pilot';
    document.getElementById('welcome').textContent=isManager?'Welcome, Manager':'Welcome back';
    document.getElementById('subtitle').textContent=isManager?'See what needs attention, make one evidence-based coaching decision, and keep the team moving.':'See your next assignment, practice with purpose, and understand your progress.';
    document.getElementById('app').innerHTML=isManager?managerView(me,assignmentData.assignments||[],sessionData.sessions||[],profileData.profiles||[]):learnerView(me,assignmentData.assignments||[],sessionData.sessions||[],profileData.profiles||[]);
    document.getElementById('app').insertAdjacentHTML('beforeend','<div class="trust"><b>Human-centered and secure:</b> Pilot records persist in the authenticated team workspace. Managers see authorized work evidence; private Learner Coach conversations remain learner-only. Learners can review and dispute profile claims.</div>');
  }catch(error){document.getElementById('app').innerHTML='<div class="status">'+esc(error.message)+'</div>'}
}
document.getElementById('signout').addEventListener('click',async()=>{try{await netlifyIdentity.logout()}finally{location.reload()}});
loadHome();
</script>
</body></html>
