<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilot Home — AgentTraining.ai</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="pilot-cloud.js?v=20261116-auth1"></script>
<script src="manager-brief.js?v=20261116-brief2"></script>
<style>
:root{--blue:#1a56db;--ink:#111827;--muted:#64748b;--bg:#f7f8fc;--line:#e2e8f0;--green:#047857;--amber:#b45309;--red:#b91c1c;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}nav{height:64px;padding:0 5%;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{color:var(--blue);font-size:20px;font-weight:800;text-decoration:none}.logo span{color:#f59e0b}.nav-right{display:flex;align-items:center;gap:10px}.identity{color:var(--muted);font-size:11px}.signout,.lang-btn{border:1px solid var(--line);background:#fff;color:#475569;border-radius:8px;padding:7px 10px;cursor:pointer}.lang-btn.active{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd;font-weight:800}.lang-switch{display:flex;gap:4px}.hero{padding:38px 5%;background:linear-gradient(135deg,#eff6ff 0%,#ecfdf5 100%)}.hero-inner{max-width:1180px;margin:auto}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.hero h1{font-size:36px;margin:8px 0}.hero p{color:var(--muted);line-height:1.55;margin:0;max-width:720px}.role{display:inline-block;margin-top:13px;padding:6px 10px;border-radius:99px;background:#fff;color:#1d4ed8;font-size:11px;font-weight:800;border:1px solid #bfdbfe}.shell{max-width:1180px;margin:24px auto;padding:0 18px}.status{background:#fff;border:1px dashed var(--line);border-radius:13px;padding:36px;text-align:center;color:var(--muted)}.next{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.next-label{font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.6px}.next h2{font-size:23px;margin:6px 0}.next p{margin:0;color:var(--muted);line-height:1.5}.primary{display:inline-block;white-space:nowrap;text-decoration:none;background:var(--blue);color:#fff;padding:12px 17px;border-radius:10px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.metric strong{display:block;font-size:27px;color:var(--blue);margin-bottom:4px}.metric span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.panel h2{font-size:18px;margin:0 0 14px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:14px}.step b{display:block;color:var(--blue);margin-bottom:6px}.step p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.actions{display:grid;gap:9px}.action{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}.action:hover{border-color:#93c5fd;background:#eff6ff}.action small{display:block;color:var(--muted);margin-top:3px}.arrow{color:var(--blue);font-weight:800}.result{background:#f8fafc;border-radius:10px;padding:13px;line-height:1.5}.result b{display:block;margin-bottom:4px}.result small{color:var(--muted)}.trust{margin-top:18px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;color:#065f46;font-size:12px;line-height:1.55}.empty{color:var(--muted);background:#f8fafc;border-radius:10px;padding:15px}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.next{align-items:flex-start;flex-direction:column}.hero h1{font-size:29px}.primary{width:100%;text-align:center}.identity{display:none}}@media(max-width:450px){.metrics{grid-template-columns:1fr}.hero{padding:28px 5%}.shell{padding:0 12px}}

/* Four Studios guide: manager-only orientation, shown below the AI Brief. */
.ai-guide{background:#fff;border:1px solid #bfdbfe;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
.ai-guide h2{font-size:22px;margin:8px 0}.ai-guide p{line-height:1.55;color:#475569;margin:0 0 14px}
.ai-guide-choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:15px 0}
.ai-guide-choice{border:1px solid #cbd5e1;border-radius:11px;padding:13px 12px;background:#f8fafc;color:#1e3a8a;font-weight:700;text-align:left;cursor:pointer;font-size:14px}
.ai-guide-choice:hover,.ai-guide-choice:focus-visible{border-color:#1a56db;outline:2px solid transparent;background:#eff6ff}
.ai-guide-choice[aria-pressed="true"]{border-color:#1a56db;background:#dbeafe}
.ai-guide-result{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:15px;margin-top:10px}
.ai-guide-result[hidden]{display:none}.ai-guide-result h3{margin:0 0 6px;color:#1e3a8a;font-size:17px}
.ai-guide-result p{margin:0 0 10px}.ai-guide-links{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ai-guide-links a{padding:10px 13px;border-radius:9px;font-weight:700;text-decoration:none}
.ai-guide-open{background:#1a56db;color:white}.ai-guide-chat{background:#e7edff;color:#1e40af}
@media(max-width:800px){.ai-guide-choices{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.ai-guide-choices{grid-template-columns:1fr}.ai-guide-links a{width:100%;text-align:center}}

/* Manager AI Brief: the AI speaks first (finding, the member's own words, one prepared Practice). Logic in manager-brief.js. */
.ai-brief{--brief-ink:#0f172a;--brief-soft:#475569;--brief-rule:#dbe3ee;background:#fff;border:1px solid var(--brief-rule);border-radius:18px;margin-bottom:18px;color:var(--brief-ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif;overflow:hidden}
.brief-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;padding:26px 30px 0;font-size:13px;color:var(--brief-soft)}
.brief-who{font-weight:700;color:var(--blue)}
.brief-headline{margin:10px 0 0;padding:0 30px;font-size:29px;line-height:1.32;font-weight:800;letter-spacing:-.01em;max-width:30em}
.brief-follow{display:block;margin-top:6px;font-size:.76em;line-height:1.45;font-weight:500;letter-spacing:0;color:#334155}
.brief-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:18px 30px 0}
.brief-chips-label{font-size:13px;color:var(--brief-soft);margin-right:2px}
.brief-chip{font:inherit;font-size:13px;display:inline-flex;gap:7px;align-items:baseline;border:1px solid #cbd5e1;background:#fff;color:var(--brief-ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.brief-chip span{color:var(--brief-soft)}
.brief-chip:hover{border-color:var(--blue)}
.brief-chip:focus-visible,.brief-primary:focus-visible,.brief-secondary:focus-visible,.brief-link:focus-visible,.ai-brief select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.brief-chip[aria-pressed="true"]{background:var(--brief-ink);border-color:var(--brief-ink);color:#fff}
.brief-chip[aria-pressed="true"] span{color:#cbd5e1}
.brief-body{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);margin-top:24px;border-top:1px solid var(--brief-rule)}
.brief-body.is-single{grid-template-columns:minmax(0,560px)}
.brief-col{padding:24px 30px 26px;min-width:0}
.brief-col h3{margin:0 0 8px;font-size:17px;line-height:1.35}
.brief-evidence{background:#f8fafc;border-right:1px solid var(--brief-rule)}
.brief-context,.brief-plain,.brief-case{margin:0 0 12px;color:var(--brief-soft);line-height:1.6;font-size:13.5px}
.brief-transcript{background:#fff;border:1px solid var(--brief-rule);border-radius:10px;padding:6px 16px}
.brief-turn{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid #eef2f7}
.brief-turn:first-child{border-top:0}
.brief-speaker{font-size:12.5px;color:var(--brief-soft);padding-top:2px;overflow-wrap:anywhere}
.brief-turn p{margin:0;line-height:1.7;font-size:14.5px;color:#334155}
.brief-turn.is-marked .brief-speaker{color:var(--brief-ink);font-weight:700}
.brief-turn mark{color:var(--brief-ink);background:linear-gradient(#fde68a,#fde68a) no-repeat 0 88%/100% 46%;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.brief-margin{margin:9px 0 0 calc(5.2em + 28px);font-size:12.5px;color:#92400e;line-height:1.5}
.brief-tip{margin:14px 0 0;padding-left:12px;border-left:3px solid #cbd5e1;font-size:13.5px;line-height:1.6;color:#334155}
.brief-tip b{display:block;font-size:12.5px;color:var(--brief-soft);font-weight:600}
.brief-link{display:inline-block;margin-top:14px;font-size:13.5px;color:var(--blue);font-weight:600}
.brief-practice{border:1px solid var(--brief-rule);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.brief-practice b{font-size:15.5px;line-height:1.4}
.brief-practice p{margin:6px 0 0;font-size:13.5px;line-height:1.6;color:#334155}
.brief-practice .brief-opening{color:var(--brief-soft)}
.brief-focus{display:flex;gap:9px;align-items:flex-start;margin:0 0 14px;font-size:13.5px;line-height:1.55;color:#334155;cursor:pointer}
.brief-focus input{margin:3px 0 0;width:16px;height:16px;flex:0 0 auto;accent-color:var(--blue)}
.brief-fields{display:grid;gap:10px;margin-bottom:16px}
.brief-field{display:grid;grid-template-columns:4.2em minmax(0,1fr);align-items:center;gap:10px;font-size:13px;color:var(--brief-soft)}
.brief-field select{font:inherit;font-size:13.5px;color:var(--brief-ink);border:1px solid #cbd5e1;border-radius:8px;padding:8px 9px;background:#fff;min-width:0;width:100%}
.brief-buttons{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brief-primary{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 20px;cursor:pointer;text-decoration:none;display:inline-block}
.brief-primary:hover{background:#1648b8}
.brief-primary:disabled{opacity:.6;cursor:wait}
.brief-secondary{font:inherit;font-size:14px;font-weight:600;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--brief-ink);padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.brief-secondary:hover{border-color:var(--blue);color:var(--blue)}
.brief-fine{margin:12px 0 0;font-size:12.5px;color:var(--brief-soft);line-height:1.5}
.brief-error{margin:0 0 12px;font-size:13.5px;color:var(--red);line-height:1.5}
.brief-loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 40px;padding:20px 30px;border-top:1px solid var(--brief-rule)}
.brief-loop h3{margin:0 0 6px;font-size:13.5px;color:var(--brief-soft);font-weight:600}
.brief-loop ul{list-style:none;margin:0;padding:0}
.brief-loop li{font-size:13.5px;line-height:1.6;padding:4px 0;color:#334155}
.brief-loop a{color:var(--blue);font-weight:600;white-space:nowrap}
.brief-foot{margin:0;padding:14px 30px 18px;border-top:1px solid var(--brief-rule);font-size:12.5px;line-height:1.6;color:var(--brief-soft)}
.brief-foot a{color:var(--blue)}
.brief-label{margin:0 0 6px;font-size:12.5px;font-weight:700;color:var(--blue)}
.brief-chip i{font-style:normal;font-size:11.5px;color:#92400e;background:#fef3c7;border-radius:99px;padding:1px 7px}
.brief-chip.is-old span,.brief-chip.is-none span{font-style:normal;color:#64748b}
.brief-chip.is-old,.brief-chip.is-none{border-style:dashed}
.brief-chip[aria-pressed="true"].is-old,.brief-chip[aria-pressed="true"].is-none{border-style:solid}
.brief-chip[aria-pressed="true"] i{background:#fde68a}
.brief-when{margin:0 0 10px;font-size:13px;line-height:1.55;color:var(--green);font-weight:600}
.brief-when.is-old{color:#92400e;background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:8px 10px;font-weight:600}
.brief-nolines{color:#92400e}
.brief-existing{border:1px solid var(--brief-rule);border-radius:12px;padding:16px 18px;margin-bottom:18px;background:#f8fafc}
.brief-existing.is-new{border-color:#6ee7b7;background:#f0fdf4}
.brief-existing.is-new h3{color:var(--green)}
.brief-existing.is-overdue{border-color:#fcd34d;background:#fffbeb}
.brief-existing .brief-label{color:#475569}
.brief-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;font-size:14.5px;line-height:1.45}
.brief-pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:#e2e8f0;color:#334155;white-space:nowrap}
.brief-existing.is-overdue .brief-pill{background:#fde68a;color:#92400e}
.brief-existing .brief-buttons{margin-top:12px}
.brief-existing .brief-secondary{font-size:13.5px;padding:9px 13px}
.brief-why{margin:0 0 6px;display:grid;grid-template-columns:8.2em minmax(0,1fr);gap:7px 12px;font-size:13.5px;line-height:1.55}
.brief-why dt{color:var(--brief-soft);font-weight:600}
.brief-why dd{margin:0;color:#334155}
.brief-why + .brief-fine{margin:0 0 14px}
.brief-practice p span{color:var(--brief-soft)}
.brief-loop li.is-overdue{color:#92400e}
@media(prefers-reduced-motion:no-preference){
 .ai-brief.is-entering .brief-headline,.ai-brief.is-entering .brief-evidence,.ai-brief.is-entering .brief-action{animation:brief-in .5s ease-out both}
 .ai-brief.is-entering .brief-evidence{animation-delay:.35s}
 .ai-brief.is-entering .brief-action{animation-delay:.7s}
 .ai-brief.is-entering .brief-turn mark{animation:brief-mark .7s ease-out 1s both}
}
@keyframes brief-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes brief-mark{from{background-size:0 46%}to{background-size:100% 46%}}
@media(max-width:860px){.brief-body{grid-template-columns:1fr}.brief-evidence{border-right:0;border-bottom:1px solid var(--brief-rule)}.brief-headline{font-size:24px}}
@media(max-width:520px){.brief-top,.brief-headline,.brief-chips{padding-left:18px;padding-right:18px}.brief-col{padding:20px 18px 22px}.brief-loop,.brief-foot{padding-left:18px;padding-right:18px}.brief-headline{font-size:21px}.brief-chip{flex-wrap:wrap;row-gap:2px}.brief-turn{grid-template-columns:1fr;gap:2px}.brief-margin{margin-left:0}.brief-why{grid-template-columns:1fr;gap:2px 0}.brief-why dd{margin-bottom:8px}.brief-primary,.brief-secondary{width:100%;text-align:center}}
</style>
</head>
<body>
<nav><a class="logo" href="index.html">AgentTraining<span>.AI</span></a><div class="nav-right"><div class="lang-switch" aria-label="Language / 语言"><a class="lang-btn" id="langEn" href="pilot.html?pilot=1&amp;lang=en">EN</a><a class="lang-btn" id="langZh" href="pilot.html?pilot=1&amp;lang=zh">中文</a></div><span class="identity" id="identity">Secure Pilot</span><button class="signout" id="signout" type="button">Sign out / 退出</button></div></nav>
<header class="hero"><div class="hero-inner"><div class="eyebrow">Secure Pilot Workspace</div><h1 id="welcome">Welcome to your Pilot Home</h1><p id="subtitle">One clear place to see what matters now and where to go next.</p><span class="role" id="roleBadge">Loading role…</span></div></header>
<main class="shell" id="app"><div class="status">Loading your secure workspace…</div></main>
<script>
const requestedLang=new URLSearchParams(location.search).get('lang');if(requestedLang==='en'||requestedLang==='zh')sessionStorage.setItem('agentraining_lang',requestedLang);const currentLang=requestedLang||sessionStorage.getItem('agentraining_lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');
const t=(en,zh)=>currentLang==='zh'?zh:en;
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
document.getElementById('langEn').classList.toggle('active',currentLang==='en');
document.getElementById('langZh').classList.toggle('active',currentLang==='zh');
document.documentElement.lang=currentLang==='zh'?'zh-CN':'en';
document.querySelector('.eyebrow').textContent=t('Secure Pilot Workspace','安全试用工作区');
document.getElementById('welcome').textContent=t('Welcome to your Pilot Home','欢迎进入试用首页');
document.getElementById('subtitle').textContent=t('One clear place to see what matters now and where to go next.','在这里清楚查看当前重点，以及下一步该做什么。');
document.getElementById('roleBadge').textContent=t('Loading role…','正在读取账号角色…');
document.querySelector('#app .status').textContent=t('Loading your secure workspace…','正在载入您的安全工作区…');
const active=a=>(a||[]).filter(x=>x.status!=='Completed');

const GUIDE_TOPICS=[
 {id:'practice',titleEn:'Practice Studio',titleZh:'练习工作室',
  detailEn:'Where team members rehearse a client conversation and get a score, a transcript and coaching feedback. The words quoted in the brief at the top of this page come from here.',
  detailZh:'成员在这里模拟客户对话，得到分数、完整对话记录和教练反馈。页面顶部简报里引用的原话，就来自这里。',
  href:'simulator.html?ref=demo&pilot=1'},
 {id:'client',titleEn:'Client Studio',titleZh:'客户工作室',
  detailEn:'Where files on prospective clients and recruiting candidates are kept and linked to scenario Practice, so a team member rehearses for a person they are actually about to meet.',
  detailZh:'潜在客户与招募候选人的档案保存在这里，并连接到情境练习，让成员为真正要见的人做准备。',
  href:'simulator.html?ref=demo&pilot=1&studio=client'},
 {id:'knowledge',titleEn:'Knowledge Studio',titleZh:'知识工作室',
  detailEn:'Where your company material is analyzed, approved by you, and turned into Practice and question banks. The Practice prepared in the brief at the top of this page comes from here.',
  detailZh:'您的公司资料在这里被分析、由您审核，再变成练习和题库。页面顶部简报里准备好的练习，就来自这里。',
  href:'knowledge.html?pilot=1'},
 {id:'leadership',titleEn:'Leadership Studio',titleZh:'主管工作室',
  detailEn:'Where you see every assignment, result and transcript for the team, and confirm what happens next. Nothing is assigned without you.',
  detailZh:'整个团队的练习指派、结果和对话记录都在这里，由您确认下一步。没有您的确认，不会指派任何练习。',
  href:'manager.html?pilot=1'}
];
function managerGuide(){
 const choices=GUIDE_TOPICS.map(function(topic){
  return '<button type="button" class="ai-guide-choice" data-guide-topic="'+topic.id+'" aria-pressed="false">'+esc(t(topic.titleEn,topic.titleZh))+'</button>';
 }).join('');
 return '<section class="ai-guide" id="ai-guide" aria-labelledby="ai-guide-title">'
  +'<h2 id="ai-guide-title">'+t('What each of the four Studios is for','四个工作室各自做什么')+'</h2>'
  +'<p>'+t('The brief at the top of this page draws on all four. Pick one to see what it does, then open it or ask your AI Copilot about it.','页面顶部的简报用到了这四个工作室。选一个看看它做什么，然后直接进入，或者向 AI Copilot 提问。')+'</p>'
  +'<div class="ai-guide-choices" role="group" aria-label="'+t('Choose a Studio','选择工作室')+'">'+choices+'</div>'
  +'<div id="ai-guide-result" class="ai-guide-result" hidden aria-live="polite"><h3 id="ai-guide-topic-title"></h3><p id="ai-guide-topic-description"></p>'
  +'<div class="ai-guide-links"><a id="ai-guide-open" class="ai-guide-open" href="#">'+t('Open this Studio','进入这个工作室')+'</a>'
  +'<a id="ai-guide-chat" class="ai-guide-chat" href="manager-chat.html?pilot=1">'+t('Ask your AI Copilot about it','向 AI Copilot 提问')+'</a></div></div></section>';
}
function activateManagerGuide(){
 const root=document.getElementById('ai-guide');if(!root)return;
 const buttons=Array.from(root.querySelectorAll('[data-guide-topic]'));
 buttons.forEach(function(button){button.addEventListener('click',function(){
  const topic=GUIDE_TOPICS.find(function(item){return item.id===button.dataset.guideTopic});
  if(!topic)return;
  buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b===button))});
  document.getElementById('ai-guide-topic-title').textContent=t(topic.titleEn,topic.titleZh);
  document.getElementById('ai-guide-topic-description').textContent=t(topic.detailEn,topic.detailZh);
  document.getElementById('ai-guide-open').href=topic.href;
  document.getElementById('ai-guide-chat').href='manager-chat.html?pilot=1&guide='+encodeURIComponent(topic.id)+'&lang='+encodeURIComponent(currentLang);
  document.getElementById('ai-guide-result').hidden=false;
 })});
}

function managerView(me,assignments,sessions,profiles,hideNext){
  const open=active(assignments),completed=(assignments||[]).filter(x=>x.status==='Completed'),recent=sessions?.[0];
  const attention=(profiles||[]).filter(p=>(p.claims||[]).some(c=>c.status==='active'&&c.claimType==='growth_area')).length;
  const isAdmin=(me.roles||[]).includes('admin');

  <section class="metrics"><div class="metric"><strong>${profiles.length}</strong><span>${t("Team members with evidence","已有练习证据的团队成员")}</span></div><div class="metric"><strong>${open.length}</strong><span>${t("Active assignments","进行中的练习指派")}</span></div><div class="metric"><strong>${completed.length}</strong><span>${t("Completed assignments","已完成的练习指派")}</span></div><div class="metric"><strong>${attention}</strong><span>${t("Members with a coaching focus","目前有辅导重点的成员")}</span></div></section>
  <section class="grid"><div class="panel"><h2>${t("How to run the training loop","如何完成培训循环")}</h2><div class="steps"><div class="step"><b>${t("1 · Understand","1 · 了解情况")}</b><p>${t("Use Manager AI to inspect authorized evidence—not private learner conversations.","使用主管 AI 查看已授权的练习证据；主管看不到学员与私人 AI 教练的对话。")}</p></div><div class="step"><b>${t("2 · Confirm","2 · 主管确认")}</b><p>${t("Review the suggested Practice and confirm it before anything is sent.","查看 AI 建议的练习，并由主管确认后再发给学员。")}</p></div><div class="step"><b>${t("3 · Coach","3 · 跟进辅导")}</b><p>${t("Track completion, transcript, score, and follow-up evidence.","查看完成状态、完整对话记录（Transcript）、分数和后续表现记录。")}</p></div></div>${recent?`<div class="result" style="margin-top:13px"><b>${t("Latest team result: ","最新团队练习结果：")}${esc(recent.scenario)}</b><small>${esc(recent.learnerName||recent.learner)} · ${esc(recent.scores?.overall||0)}/100 · ${esc(new Date(recent.savedAt).toLocaleDateString())}</small></div>`:''}</div>
  <div class="panel"><h2>${t("Manager workspace","主管工作区")}</h2><div class="actions">${adminAction}<a class="action" href="pilot-launch.html?pilot=1"><span><b>${t("Pilot Launch Center","Pilot 启动中心")}</b><small>${t("Automatic readiness checks and a guided 14-day plan","自动检查准备状态，并提供清楚的 14 天执行计划")}</small></span><span class="arrow">→</span></a><a class="action" href="team-messages.html?pilot=1"><span><b>${t("Team Messages","团队消息")}</b><small>${t("Message a team member directly about work and follow-up","直接与团队成员沟通工作和后续跟进")}</small></span><span class="arrow">→</span></a><a class="action" href="manager-chat.html?pilot=1"><span><b>${t("Manager AI","主管 AI")}</b><small>${t("Evidence-based member coaching","根据练习证据辅导团队成员")}</small></span><span class="arrow">→</span></a><a class="action" href="manager.html?pilot=1"><span><b>${t("Manager Studio","主管工作台")}</b><small>${t("Assignments, results and transcripts","查看练习指派、结果和完整对话记录")}</small></span><span class="arrow">→</span></a><a class="action" href="learner-profile.html?pilot=1"><span><b>${t("Learner Profiles","学员档案")}</b><small>${t("Claims, evidence and confidence","查看 AI 发现的能力表现、依据和可信程度")}</small></span><span class="arrow">→</span></a><a class="action" href="knowledge-chat.html?pilot=1"><span><b>${t("Company Knowledge","企业知识库")}</b><small>${t("Analyze, approve and convert training material","分析、审核培训材料，并转化为练习")}</small></span><span class="arrow">→</span></a></div></div></section>`;
}
function learnerView(me,assignments,sessions,profiles){
  const open=active(assignments),next=open[0],recent=sessions?.[0],profile=profiles?.[0];
  const nextBlock=next?{title:next.scenarioName,text:t(`${next.mode||'standard'} Practice · ${next.status}`,`${next.mode==='quick'?'快速':next.mode==='full'?'完整':'标准'}练习 · ${next.status==='Completed'?'已完成':'已指派'}`),href:`simulator.html?ref=demo&pilot=1&assignment=${encodeURIComponent(next.id)}`,label:t('Start assigned Practice','开始指定练习')}:{title:t('Ask your Personal AI Coach','咨询您的私人 AI 教练'),text:t('There is no active assignment. Review your evidence and decide what to strengthen next.','目前没有进行中的练习指派。您可以查看个人练习证据，决定下一步加强什么。'),href:'coach-chat.html?pilot=1',label:t('Open My Coach','打开我的 AI 教练')};
  const claims=(profile?.claims||[]).filter(c=>c.status==='active');
  return `<section class="next"><div><div class="next-label">${t("Your next action","下一步")}</div><h2>${esc(nextBlock.title)}</h2><p>${esc(nextBlock.text)}</p></div><a class="primary" href="${nextBlock.href}">${esc(nextBlock.label)}</a></section>
  <section class="metrics"><div class="metric"><strong>${open.length}</strong><span>${t("Active assignments","进行中的练习指派")}</span></div><div class="metric"><strong>${sessions.length}</strong><span>${t("Completed Practice sessions","已完成的练习次数")}</span></div><div class="metric"><strong>${recent?esc(recent.scores?.overall||0):'—'}</strong><span>${t("Latest overall score","最近一次总分")}</span></div><div class="metric"><strong>${claims.length}</strong><span>${t("Current evidence claims","目前记录的能力表现")}</span></div></section>
  <section class="grid"><div class="panel"><h2>${t("How your learning loop works","您的学习循环如何运作")}</h2><div class="steps"><div class="step"><b>${t("1 · Receive","1 · 接收任务")}</b><p>${t("Your confirmed assignment appears here and in your private Coach Chat.","主管确认的练习会出现在这里，也会出现在您的私人 AI 教练对话中。")}</p></div><div class="step"><b>${t("2 · Practice","2 · 完成练习")}</b><p>${t("Complete the conversation and receive a score, transcript and Coach Summary.","完成对话后，您会收到分数、完整对话记录（Transcript）和教练总结。")}</p></div><div class="step"><b>${t("3 · Improve","3 · 持续改进")}</b><p>${t("Your evidence and next coaching focus update automatically.","系统会自动更新您的练习证据和下一项辅导重点。")}</p></div></div>${recent?`<div class="result" style="margin-top:13px"><b>${t("Latest result: ","最近一次练习结果：")}${esc(recent.scenario)}</b><small>${esc(recent.scores?.overall||0)}/100 · ${esc(new Date(recent.savedAt).toLocaleDateString())}</small></div>`:''}</div>
  <div class="panel"><h2>${t("Your workspace","您的工作区")}</h2><div class="actions"><a class="action" href="team-messages.html?pilot=1"><span><b>${t("Team Messages","团队消息")}</b><small>${t("Read and reply to work messages from your manager","查看并回复主管发送的工作消息")}</small></span><span class="arrow">→</span></a><a class="action" href="coach-chat.html?pilot=1"><span><b>${t("My Personal AI Coach","我的私人 AI 教练")}</b><small>${t("Private coaching and Assignment Inbox","私人辅导和练习任务收件箱")}</small></span><span class="arrow">→</span></a><a class="action" href="learner-profile.html?pilot=1"><span><b>${t("My Success Profile","我的成长档案")}</b><small>${t("Evidence, confidence and correction","查看练习证据、可信程度并申请更正")}</small></span><span class="arrow">→</span></a><a class="action" href="simulator.html?ref=demo&pilot=1"><span><b>${t("Practice Studio","练习工作室")}</b><small>${t("Explore curriculum and practice","选择培训情境并进行练习")}</small></span><span class="arrow">→</span></a><a class="action" href="knowledge.html?pilot=1"><span><b>${t("Company Knowledge","企业知识库")}</b><small>${t("Manager-approved training knowledge","查看主管审核通过的培训知识")}</small></span><span class="arrow">→</span></a></div></div></section>`;
}
// The brief renders at once from data already loaded; approved Company Knowledge and the standard
// curriculum arrive a moment later and only refine which Practice is offered. Neither is required.
function mountManagerBrief(assignments,sessions,profiles){
  const brief=ManagerBrief.mount(document.getElementById('ai-brief'),{lang:currentLang,assignments,sessions,profiles,ready:false,
    assign:payload=>PilotCloud.request('assignments',{method:'POST',requiredRole:'manager',body:JSON.stringify(payload)})});
  const knowledge=PilotCloud.request('knowledge',{requiredRole:'manager'}).then(d=>d.sources||[]).catch(e=>{console.warn('Brief: Company Knowledge unavailable:',e.message);return []});
  const curriculum=fetch('data/curriculum/foundation.json').then(r=>r.ok?r.json():[]).then(d=>Array.isArray(d)?d:(d.scenarios||d.curriculum||[])).catch(e=>{console.warn('Brief: curriculum unavailable:',e.message);return []});
  Promise.all([knowledge,curriculum]).then(([k,c])=>brief.update({knowledge:k,curriculum:c,ready:true}));
}
async function loadHome(){
  if(!PilotCloud.enabled){location.replace('pilot.html?pilot=1');return}
  try{
    const me=await PilotCloud.request('me');const isManager=(me.roles||[]).some(r=>r==='manager'||r==='admin');
    if(isManager&&!new URLSearchParams(location.search).has('briefed')){location.replace('manager-risk-briefing.html?pilot=1&lang='+encodeURIComponent(currentLang));return}
    const opts=isManager?{requiredRole:'manager'}:{};
    const [assignmentData,sessionData,profileData]=await Promise.all([PilotCloud.request('assignments',opts),PilotCloud.request('sessions',opts),PilotCloud.request('profiles',opts)]);
    document.getElementById('identity').textContent=me.email;document.getElementById('roleBadge').textContent=isManager?t('Manager Pilot','主管试用账号'):t('Learner Pilot','学员试用账号');
    document.getElementById('welcome').textContent=isManager?t('Welcome, Manager','主管，欢迎您'):t('Welcome back','欢迎回来');
    document.getElementById('subtitle').textContent=isManager?t('See what needs attention, make one evidence-based coaching decision, and keep the team moving.','查看需要关注的事项，根据练习证据作出一项辅导决定，并推动团队继续进步。'):t('See your next assignment, practice with purpose, and understand your progress.','查看下一项练习任务，有目标地练习，并了解自己的进步。');
    const hasBrief=isManager&&!!window.ManagerBrief;
    document.getElementById('app').innerHTML=isManager?(hasBrief?'<section class="ai-brief" id="ai-brief" aria-labelledby="ai-brief-title"></section>':'')+managerView(me,assignmentData.assignments||[],sessionData.sessions||[],profileData.profiles||[],hasBrief)+managerGuide():learnerView(me,assignmentData.assignments||[],sessionData.sessions||[],profileData.profiles||[]);
    if(isManager)activateManagerGuide();
    if(hasBrief)mountManagerBrief(assignmentData.assignments||[],sessionData.sessions||[],profileData.profiles||[]);
    document.getElementById('app').insertAdjacentHTML('beforeend','<div class="trust"><b>'+t('Human-centered and secure:','以人为中心并保护隐私：')+'</b> '+t('Pilot records persist in the authenticated team workspace. Managers see authorized work evidence; private Learner Coach conversations remain learner-only. Learners can review and dispute AI-recorded profile observations.','试用记录保存在经过登录验证的团队工作区。主管只能查看已授权的练习证据；学员与私人 AI 教练的对话仅学员本人可见。学员可以查看并对 AI 记录的能力表现提出异议。')+'</div>');
  }catch(error){document.getElementById('app').innerHTML='<div class="status">'+esc(t('Could not load the secure workspace: ','无法载入安全工作区：')+error.message)+'</div>'}
}
document.getElementById('signout').addEventListener('click',async()=>{try{await netlifyIdentity.logout()}finally{location.reload()}});
loadHome();
</script>
