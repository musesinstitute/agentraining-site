<!doctype html>
<html lang="en">

<style>
:root{--blue:#1a56db;--ink:#111827;--muted:#64748b;--bg:#f7f8fc;--line:#e2e8f0;--green:#047857;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}nav{height:64px;padding:0 5%;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{color:var(--blue);font-size:20px;font-weight:800;text-decoration:none}.logo span{color:#f59e0b}.nav-right{display:flex;align-items:center;gap:10px}.identity{color:var(--muted);font-size:11px}.signout,.lang-btn{border:1px solid var(--line);background:#fff;color:#475569;border-radius:8px;padding:7px 10px;cursor:pointer}.lang-btn.active{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd;font-weight:800}.lang-switch{display:flex;gap:4px}.hero{padding:38px 5%;background:linear-gradient(135deg,#eff6ff 0%,#ecfdf5 100%)}.hero-inner{max-width:1180px;margin:auto}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.hero h1{font-size:36px;margin:8px 0}.hero p{color:var(--muted);line-height:1.55;margin:0;max-width:720px}.role{display:inline-block;margin-top:13px;padding:6px 10px;border-radius:99px;background:#fff;color:#1d4ed8;font-size:11px;font-weight:800;border:1px solid #bfdbfe}.shell{max-width:1180px;margin:24px auto;padding:0 18px}.status{background:#fff;border:1px dashed var(--line);border-radius:13px;padding:36px;text-align:center;color:var(--muted)}.next{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.next.assignment{border:2px solid #60a5fa;background:linear-gradient(135deg,#eff6ff 0%,#fff 64%);box-shadow:0 14px 34px rgba(26,86,219,.13)}.next-label{font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.6px}.next.assignment .next-label{color:#1d4ed8}.next h2{font-size:23px;margin:6px 0}.next.assignment h2{font-size:27px}.next p{margin:0;color:var(--muted);line-height:1.5}.assignment-title{font-weight:800;color:var(--ink);font-size:16px;margin-top:7px}.assignment-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.assignment-meta span{display:inline-block;background:#fff;border:1px solid #bfdbfe;border-radius:99px;padding:5px 9px;color:#1e40af;font-size:11px;font-weight:700}.primary{display:inline-block;white-space:nowrap;text-decoration:none;background:var(--blue);color:#fff;padding:12px 17px;border-radius:10px;font-weight:800}.next.assignment .primary{font-size:16px;padding:14px 22px;box-shadow:0 7px 18px rgba(26,86,219,.22)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.metric strong{display:block;font-size:27px;color:var(--blue);margin-bottom:4px}.metric span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.panel h2{font-size:18px;margin:0 0 14px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:14px}.step b{display:block;color:var(--blue);margin-bottom:6px}.step p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.actions{display:grid;gap:9px}.action{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}.action:hover{border-color:#93c5fd;background:#eff6ff}.action small{display:block;color:var(--muted);margin-top:3px}.arrow{color:var(--blue);font-weight:800}.result{background:#f8fafc;border-radius:10px;padding:13px;line-height:1.5}.result b{display:block;margin-bottom:4px}.result small{color:var(--muted)}.trust{margin-top:18px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;color:#065f46;font-size:12px;line-height:1.55}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.next{align-items:flex-start;flex-direction:column}.hero h1{font-size:29px}.primary{width:100%;text-align:center}.identity{display:none}}@media(max-width:450px){.metrics{grid-template-columns:1fr}.hero{padding:28px 5%}.shell{padding:0 12px}}
</style>
</head>
<body>
<nav><a class="logo" href="index.html">AgentTraining<span>.AI</span></a><div class="nav-right"><div class="lang-switch"><a class="lang-btn" id="langEn" href="pilot.html?pilot=1&amp;lang=en">EN</a><a class="lang-btn" id="langZh" href="pilot.html?pilot=1&amp;lang=zh">中文</a></div><span class="identity" id="identity">Secure Pilot</span><button class="signout" id="signout" type="button">Sign out / 退出</button></div></nav>
<header class="hero"><div class="hero-inner"><div class="eyebrow">Secure Pilot Workspace</div><h1 id="welcome">Welcome to your Pilot Home</h1><p id="subtitle">One clear place to see what matters now and where to go next.</p><span class="role" id="roleBadge">Loading role…</span></div></header>
<main class="shell" id="app"><div class="status">Loading your secure workspace…</div></main>
<script>
const requestedLang=new URLSearchParams(location.search).get('lang');if(requestedLang==='en'||requestedLang==='zh')sessionStorage.setItem('agentraining_lang',requestedLang);const currentLang=requestedLang||sessionStorage.getItem('agentraining_lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');
const t=(en,zh)=>currentLang==='zh'?zh:en;const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
document.getElementById('langEn').classList.toggle('active',currentLang==='en');document.getElementById('langZh').classList.toggle('active',currentLang==='zh');document.documentElement.lang=currentLang==='zh'?'zh-CN':'en';
document.querySelector('.eyebrow').textContent=t('Secure Pilot Workspace','安全试用工作区');document.getElementById('welcome').textContent=t('Welcome to your Pilot Home','欢迎进入试用首页');document.getElementById('subtitle').textContent=t('One clear place to see what matters now and where to go next.','在这里清楚查看当前重点，以及下一步该做什么。');document.getElementById('roleBadge').textContent=t('Loading role…','正在读取账号角色…');
const active=a=>(a||[]).filter(x=>x.status!=='Completed');
const createdValue=a=>{const raw=a?.createdAt||a?.assignedAt||a?.updatedAt;const n=raw?Date.parse(raw):NaN;return Number.isFinite(n)?n:0};
const formatDue=a=>{const raw=a?.dueDate||a?.dueAt||a?.deadline;if(!raw)return'';const d=new Date(raw);return Number.isNaN(d.getTime())?'':t('Due ','截止 ')+d.toLocaleDateString()};
const formatLength=a=>{const raw=a?.practiceLength||a?.durationMinutes||a?.estimatedMinutes;if(!raw)return'';return typeof raw==='number'?t(`About ${raw} min`,`约 ${raw} 分钟`):String(raw)};
function managerView(me,assignments,sessions,profiles){const open=active(assignments),completed=(assignments||[]).filter(x=>x.status==='Completed'),recent=sessions?.[0];const attention=(profiles||[]).filter(p=>(p.claims||[]).some(c=>c.status==='active'&&c.claimType==='growth_area')).length;const next=open.length?{title:t('Review active assignments','查看进行中的练习指派'),text:t(`${open.length} active assignments need attention.`,`${open.length} 项练习正在等待处理。`),href:'manager.html?pilot=1'}:{title:t('Ask Manager AI about one member','请主管 AI 分析一名学员'),text:t('Review evidence and confirm a targeted Practice.','查看练习证据，并确认一个有针对性的练习。'),href:'manager-chat.html?pilot=1'};return `<section class="next"><div><div class="next-label">${t('Your next action','下一步')}</div><h2>${esc(next.title)}</h2><p>${esc(next.text)}</p></div><a class="primary" href="${next.href}">${t('Continue','继续')}</a></section><section class="metrics"><div class="metric"><strong>${profiles.length}</strong><span>${t('Team members with evidence','已有练习证据的团队成员')}</span></div><div class="metric"><strong>${open.length}</strong><span>${t('Active assignments','进行中的练习指派')}</span></div><div class="metric"><strong>${completed.length}</strong><span>${t('Completed assignments','已完成的练习指派')}</span></div><div class="metric"><strong>${attention}</strong><span>${t('Members with a coaching focus','目前有辅导重点的成员')}</span></div></section><section class="grid"><div class="panel"><h2>${t('How to run the training loop','如何完成培训循环')}</h2><div class="steps"><div class="step"><b>${t('1 · Understand','1 · 了解情况')}</b><p>${t('Inspect authorized evidence.','查看已授权的练习证据。')}</p></div><div class="step"><b>${t('2 · Confirm','2 · 主管确认')}</b><p>${t('Confirm the right Practice.','确认合适的练习。')}</p></div><div class="step"><b>${t('3 · Coach','3 · 跟进辅导')}</b><p>${t('Track completion and results.','查看完成状态和结果。')}</p></div></div>${recent?`<div class="result" style="margin-top:13px"><b>${t('Latest team result: ','最新团队练习结果：')}${esc(recent.scenario)}</b></div>`:''}</div><div class="panel"><h2>${t('Manager workspace','主管工作区')}</h2><div class="actions"><a class="action" href="manager.html?pilot=1"><span><b>${t('Manager Studio','主管工作台')}</b><small>${t('Assignments, results and transcripts','查看练习指派、结果和完整对话记录')}</small></span><span class="arrow">→</span></a><a class="action" href="knowledge-chat.html?pilot=1"><span><b>${t('Company Knowledge','企业知识库')}</b><small>${t('Analyze and convert training material','分析培训材料并转化为练习')}</small></span><span class="arrow">→</span></a><a class="action" href="team-messages.html?pilot=1"><span><b>${t('Team Messages','团队消息')}</b><small>${t('Message team members','与团队成员沟通')}</small></span><span class="arrow">→</span></a></div></div></section>`}
function learnerView(me,assignments,sessions,profiles){const open=active(assignments).sort((a,b)=>createdValue(b)-createdValue(a)),next=open[0],recent=sessions?.[0],profile=profiles?.[0];const claims=(profile?.claims||[]).filter(c=>c.status==='active');let nextHtml='';if(next){const due=formatDue(next),length=formatLength(next),remaining=open.length>1?t(`${open.length} active assignments`,`${open.length} 项进行中的练习`):'';const meta=[due,length,remaining].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');nextHtml=`<section class="next assignment"><div><div class="next-label">${t('New assignment from your manager','您的主管给您指派了一项新练习')}</div><h2>${t('Start your assigned Practice','开始主管指定的练习')}</h2><div class="assignment-title">${esc(next.scenarioName||next.title||t('Assigned Practice','指定练习'))}</div>${meta?`<div class="assignment-meta">${meta}</div>`:''}</div><a class="primary" href="simulator.html?ref=demo&pilot=1&assignment=${encodeURIComponent(next.id)}">${t('Start Practice →','开始练习 →')}</a></section>`}else{nextHtml=`<section class="next"><div><div class="next-label">${t('Your next action','下一步')}</div><h2>${t('Ask your Personal AI Coach','咨询您的私人 AI 教练')}</h2><p>${t('There is no active assignment.','目前没有进行中的练习指派。')}</p></div><a class="primary" href="coach-chat.html?pilot=1">${t('Open My Coach','打开我的 AI 教练')}</a></section>`}return `${nextHtml}<section class="metrics"><div class="metric"><strong>${open.length}</strong><span>${t('Active assignments','进行中的练习指派')}</span></div><div class="metric"><strong>${sessions.length}</strong><span>${t('Completed Practice sessions','已完成的练习次数')}</span></div><div class="metric"><strong>${recent?esc(recent.scores?.overall||0):'—'}</strong><span>${t('Latest overall score','最近一次总分')}</span></div><div class="metric"><strong>${claims.length}</strong><span>${t('Current evidence claims','目前记录的能力表现')}</span></div></section><section class="grid"><div class="panel"><h2>${t('How your learning loop works','您的学习循环如何运作')}</h2><div class="steps"><div class="step"><b>${t('1 · Receive','1 · 接收任务')}</b><p>${t('Your newest manager assignment appears first.','主管最新指定的练习会优先显示在本页最上方。')}</p></div><div class="step"><b>${t('2 · Practice','2 · 完成练习')}</b><p>${t('Complete the conversation and receive feedback.','完成对话并获得反馈。')}</p></div><div class="step"><b>${t('3 · Improve','3 · 持续改进')}</b><p>${t('Use evidence to strengthen the next skill.','根据练习证据继续加强下一项能力。')}</p></div></div></div><div class="panel"><h2>${t('Your workspace','您的工作区')}</h2><div class="actions"><a class="action" href="team-messages.html?pilot=1"><span><b>${t('Team Messages','团队消息')}</b><small>${t('Messages from your manager','查看主管发送的消息')}</small></span><span class="arrow">→</span></a><a class="action" href="coach-chat.html?pilot=1"><span><b>${t('My Personal AI Coach','我的私人 AI 教练')}</b><small>${t('Private coaching and Assignment Inbox','私人辅导和练习任务收件箱')}</small></span><span class="arrow">→</span></a><a class="action" href="simulator.html?ref=demo&pilot=1"><span><b>${t('Practice Studio','练习工作室')}</b><small>${t('Explore curriculum and practice','选择培训情境并进行练习')}</small></span><span class="arrow">→</span></a><a class="action" href="knowledge.html?pilot=1"><span><b>${t('Company Knowledge','企业知识库')}</b><small>${t('Manager-approved training knowledge','查看主管审核通过的培训知识')}</small></span><span class="arrow">→</span></a></div></div></section>`}
let homeLoading=false;async function loadHome(){if(homeLoading)return;homeLoading=true;try{if(!window.PilotCloud||!PilotCloud.enabled)throw new Error(t('Open this page with ?pilot=1.','请使用 ?pilot=1 打开此页面。'));await PilotCloud.ready();const me=await PilotCloud.request('me');const isManager=(me.roles||[]).some(r=>r==='manager'||r==='admin');const opts=isManager?{requiredRole:'manager'}:{};const [assignmentData,sessionData,profileData]=await Promise.all([PilotCloud.request('assignments',opts),PilotCloud.request('sessions',opts),PilotCloud.request('profiles',opts)]);document.getElementById('identity').textContent=me.email;document.getElementById('roleBadge').textContent=isManager?t('Manager Pilot','主管试用账号'):t('Learner Pilot','学员试用账号');document.getElementById('welcome').textContent=isManager?t('Welcome, Manager','主管，欢迎您'):t('Welcome back','欢迎回来');document.getElementById('subtitle').textContent=isManager?t('See what needs attention and keep the team moving.','查看需要关注的事项，并推动团队继续进步。'):t('Your newest manager-assigned Practice appears first. Start it with one click.','主管最新指定的练习会优先显示在这里，一键即可开始。');document.getElementById('app').innerHTML=isManager?managerView(me,assignmentData.assignments||[],sessionData.sessions||[],profileData.profiles||[]):learnerView(me,assignmentData.assignments||[],sessionData.sessions||[],profileData.profiles||[]);document.getElementById('app').insertAdjacentHTML('beforeend','<div class="trust"><b>'+t('Human-centered and secure:','以人为中心并保护隐私：')+'</b> '+t('Managers see authorized work evidence; private Learner Coach conversations remain learner-only.','主管只能查看已授权的练习证据；学员与私人 AI 教练的对话仅学员本人可见。')+'</div>')}catch(error){document.getElementById('app').innerHTML='<div class="status">'+esc(t('Could not load the secure workspace: ','无法载入安全工作区：')+error.message)+'</div>'}finally{homeLoading=false}}
document.getElementById('signout').addEventListener('click',()=>PilotCloud&&PilotCloud.signOut?PilotCloud.signOut():location.reload());
loadHome();
</script>
</body></html>
