[build]
  functions = "netlify/functions"

[[edge_functions]]
  function = "pilot-team-gate"
  path = "/.netlify/functions/pilot-data"

[[edge_functions]]
  function = "manager-render-hotfix"
  path = "/manager.html"

[[edge_functions]]
  function = "pilot-cloud-roster-patch"
  path = "/pilot-cloud.js"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
