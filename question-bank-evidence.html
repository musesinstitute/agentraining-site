<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bank — Saved Evidence</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="pilot-cloud.js?v=20260911-qb-evidence1"></script>
<style>body{font:16px system-ui;max-width:1100px;margin:36px auto;padding:0 20px;color:#18243a}button,select{font:inherit;padding:10px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:18px}summary{cursor:pointer;padding:12px}#status{min-height:24px}</style></head>
<body><h1>Saved Question Bank Evidence</h1><p>Manager access required. Reads the latest saved bank and current saved Knowledge Map. Does not generate questions or rebuild maps.</p>
<button id="library">Load document list</button><select id="document" aria-label="Document"></select><button id="read" disabled>Read saved evidence</button>
<p id="status" role="status"></p><pre id="summary"></pre><details><summary>Evidence JSON (company content)</summary><pre id="evidence"></pre></details>
<script>
'use strict';
const sources=new Map(),select=document.getElementById('document'),status=document.getElementById('status'),read=document.getElementById('read');
async function getSaved(endpoint,knowledgeId,action){const token=await PilotCloud.token('manager');const response=await fetch('/.netlify/functions/'+endpoint,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({knowledgeId,action})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Read failed');return data;}
document.getElementById('library').onclick=async()=>{status.textContent='Loading documents…';read.disabled=true;try{const data=await PilotCloud.request('knowledge',{requiredRole:'manager'});select.replaceChildren();sources.clear();for(const source of data.sources||[]){sources.set(source.id,source);const option=document.createElement('option');option.value=source.id;option.textContent=source.title;select.append(option);}read.disabled=!sources.size;status.textContent='Choose a document and read saved evidence.';}catch(error){status.textContent=error.message;}};
read.onclick=async()=>{read.disabled=true;document.getElementById('evidence').textContent='';document.getElementById('summary').textContent='';status.textContent='Reading saved records…';try{const source=sources.get(select.value);const results=await Promise.allSettled([getSaved('knowledge-question-bank-v2',source.id,'latest'),getSaved('knowledge-map',source.id,'status')]);const snapshot={retrievedAt:new Date().toISOString(),source:{id:source.id,title:source.title,status:source.status,content:source.content,createdAt:source.createdAt,updatedAt:source.updatedAt},questionBank:results[0].status==='fulfilled'?results[0].value.questionBank:null,knowledgeMap:results[1].status==='fulfilled'?results[1].value.knowledgeMap:null,errors:results.filter(r=>r.status==='rejected').map(r=>r.reason.message)};for(const record of [snapshot.questionBank,snapshot.knowledgeMap])if(record){delete record.createdBy;delete record.teamId;}document.getElementById('evidence').textContent=JSON.stringify(snapshot,null,2);const bank=snapshot.questionBank;document.getElementById('summary').textContent=JSON.stringify(bank?{title:bank.title,id:bank.id,createdAt:bank.createdAt,updatedAt:bank.updatedAt,totalQuestions:bank.totalQuestions,targetQuestions:bank.targetQuestions,coverage:bank.coverage,quality:bank.quality,diagnostics:bank.diagnostics}:snapshot.errors,null,2);status.textContent='Saved evidence loaded. No generation performed.';}catch(error){status.textContent=error.message;}finally{read.disabled=false;}};
</script></body></html>
