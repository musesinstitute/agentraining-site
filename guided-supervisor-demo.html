<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentTraining.ai | Guided Supervisor Demo</title>
<style>
:root{font:16px/1.45 Arial,sans-serif;color:#152641;background:#f0f4fb}*{box-sizing:border-box}body{margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#122d54;color:#fff;padding:16px 22px}
.brand{font-size:20px;font-weight:700}.tag{font-size:13px;color:#ccddf7}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.link{border:1px solid #aebed4;border-radius:8px;background:#fff;color:#15345e;padding:10px 14px;cursor:pointer;text-decoration:none;font-weight:700;font-size:14px}
button:focus-visible,.link:focus-visible{outline:3px solid #87b4ff}main{max-width:1500px;margin:auto;padding:14px}
section{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 4px 16px}
h1{font-size:21px;margin:0 0 8px}p{margin:0 0 6px}small{color:#53657f}.screen{height:65vh;min-height:360px;border:1px solid #c1cde1;border-radius:12px;overflow:hidden;background:#fff}iframe{width:100%;height:100%;border:0}
footer{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:14px 4px;color:#53657f;font-size:13px}
@media(max-width:600px){.screen{height:55vh;min-height:310px}.brand{font-size:17px}}
</style></head><body>
<header><div><div class="brand">AgentTraining.ai · Guided Supervisor Demo</div><div class="tag">Train Every Advisor · Coach Every Manager · Grow Every Team</div></div>
<div class="controls"><button id="prev" type="button">← Previous</button><button id="toggle" type="button">▶ Play</button><button id="next" type="button">Next →</button><a class="link" id="open" href="supervisor-demo.html" target="_blank" rel="noopener">Open page ↗</a></div></header>
<main><section><div><h1 id="title"></h1><p id="script"></p><small id="note"></small></div><strong id="count" aria-live="polite"></strong></section>
<div class="screen"><iframe id="screen" title="AgentTraining.ai existing feature"></iframe></div>
<footer><span>Tour only: no automatic clicks, submissions, assignments or changes to training data.</span><span id="time"></span></footer></main>
<script>
(()=>{'use strict';
const scenes=[
{title:'Team Growth & Retention Hub',url:'supervisor-demo.html',duration:20,line:'Turn company training into a clear, manager-led path for team growth and retention.'},
{title:'Company Training Library',url:'knowledge.html',duration:24,line:'Convert approved company learning resources into assignable practice opportunities.',note:'North Star Heritage Life Underwriting is account-specific. Open it only when it is available and authorized.'},
{title:'Practice Scenario',url:'simulator.html?ref=demo',duration:24,line:'Let advisors practice realistic client conversations and capture meaningful performance evidence.'},
{title:'AI Coaching',url:'manager-demo-phases.html',duration:22,line:'AI coaching provides suggestions and summaries; the manager decides what to adopt.',note:'This page illustrates management phases, not a recorded live AI coaching session.'},
{title:'Mission Control',url:'mission-control-v2-1.html',duration:28,line:'See the broader team picture, select the next coaching step, and review changes after seven days.',note:'Seven-day reassessment is a demonstration concept; verify real persistence and authorization independently.'},
{title:'Supervisor Next Steps',url:'manager-demo-hub.html',duration:18,line:'One connected workflow: identify gaps, assign practice, coach advisors, and follow through.'}
];
const $=id=>document.getElementById(id);let index=0,remaining=0,timer=null,playing=false;
function pause(){playing=false;clearInterval(timer);timer=null;$('toggle').textContent='▶ Play';$('time').textContent='Paused';}
function show(n){index=(n+scenes.length)%scenes.length;const s=scenes[index];$('title').textContent=s.title;$('script').textContent=s.line;$('note').textContent=s.note||'Illustrative navigation through existing pages.';$('count').textContent=(index+1)+' / '+scenes.length;$('open').href=s.url;$('screen').src=s.url;remaining=s.duration;update();}
function update(){$('time').textContent=playing?'Auto-advance in '+remaining+'s':'Paused · '+remaining+'s on this scene';}
function tick(){if(!playing)return;remaining--;if(remaining<=0){if(index===scenes.length-1){pause();return;}show(index+1);}update();}
function start(){if(playing)return;playing=true;$('toggle').textContent='❚❚ Pause';update();timer=setInterval(tick,1000);}
$('toggle').addEventListener('click',()=>playing?pause():start());
$('prev').addEventListener('click',()=>show(index-1));
$('next').addEventListener('click',()=>show(index+1));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause();});
show(0);
})();
</script></body></html>
