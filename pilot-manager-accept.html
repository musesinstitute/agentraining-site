<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Manager Account — AgentTraining.ai</title><style>body{margin:0;background:#f7f8fc;color:#111827;font:15px Arial,sans-serif}.card{max-width:520px;margin:8vh auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 12px 36px rgba(15,23,42,.08)}h1{margin:0 0 8px;color:#1a56db}p{color:#64748b;line-height:1.55}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}button{margin-top:18px;width:100%;border:0;border-radius:10px;padding:13px;background:#1a56db;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:15px;padding:12px;border-radius:9px;background:#f8fafc;color:#475569}.ok{background:#ecfdf5;color:#047857}.bad{background:#fef2f2;color:#b91c1c}</style></head><body><main class="card"><h1>Activate Manager Account</h1><p id="intro">Checking your secure invitation…</p><div id="form" hidden><label>Email</label><input id="email" disabled><label>Create password</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button id="activate">Activate Manager Account</button></div><div class="status" id="status">Loading…</div></main><script>const token=new URLSearchParams(location.search).get('token')||'',status=document.getElementById('status'),form=document.getElementById('form'),email=document.getElementById('email');function show(msg,kind=''){status.textContent=msg;status.className='status '+kind}async function lookup(){try{const r=await fetch('/.netlify/functions/pilot-manager-invite?action=lookup&token='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw new Error(d.error||'Invitation unavailable.');if(d.status==='accepted'){show('This manager account is already activated. Please sign in from AgentTraining.ai.','ok');return}email.value=d.email;document.getElementById('intro').textContent=(d.name?`Welcome ${d.name}. `:'')+'Set your password to activate your secure Manager workspace.';form.hidden=false;show('Invitation verified.')}catch(e){show(e.message,'bad')}}document.getElementById('activate').onclick=async()=>{const password=document.getElementById('password').value;if(password.length<8){show('Please use at least 8 characters.','bad');return}show('Creating your Manager account…');try{const r=await fetch('/.netlify/functions/pilot-manager-invite?action=accept',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Activation failed.');form.hidden=true;show('Manager account activated. You can now return to AgentTraining.ai and sign in.','ok')}catch(e){show(e.message,'bad')}};lookup();</script></body></html>
