<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source Trace — AgentTraining.ai</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><script src="pilot-cloud.js?v=source-trace-1"></script><style>body{margin:0;background:#f7f8fc;color:#111827;font:14px Arial,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:32px 20px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px;box-shadow:0 10px 28px rgba(15,23,42,.06)}h1{margin-top:0}.status{color:#64748b}.grid{display:grid;grid-template-columns:220px 1fr;gap:9px 14px;margin-top:18px}.k{font-weight:700;color:#475569}.v{word-break:break-word}.preview{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;line-height:1.55;margin-top:18px}.ok{color:#047857;font-weight:800}.bad{color:#b91c1c;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.k{margin-top:8px}}</style></head><body><main class="wrap"><section class="card"><h1>Assignment Source Trace</h1><p class="status" id="status">Loading newest active assignment and linked source…</p><div id="out"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const status=document.getElementById('status'),out=document.getElementById('out');try{await PilotCloud.ready();const coach=await PilotCloud.request('coach-messages');const assignments=[...(coach.assignments||[])].filter(x=>x&&x.status!=='Completed').sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));const current=assignments[0];if(!current)throw new Error('No active assignment found.');const token=await PilotCloud.token();const r=await fetch('/.netlify/functions/pilot-source-trace?assignmentId='+encodeURIComponent(current.id),{headers:{authorization:'Bearer '+token}});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.error||('Trace failed ('+r.status+').'));const t=body.trace||{};const banner=/banner life|legal & general america/i.test(t.contentPreview||'');const lending=/\blender\b|\bloan\b|credit score|creditworthiness/i.test(t.contentPreview||'');status.innerHTML='<span class="'+(banner&&!lending?'ok':'bad')+'">'+(banner&&!lending?'Source identity looks insurance-specific.':'Source identity needs review.')+'</span>';const rows=[['Assignment',t.assignmentName],['Assignment ID',t.assignmentId],['Source label',t.sourceLabel],['sourceKnowledgeId',t.sourceKnowledgeId],['Knowledge title',t.knowledgeTitle],['Knowledge status',t.knowledgeStatus],['Content length',t.contentLength],['SHA-256',t.contentSha256],['Banner/LGA marker',banner?'YES':'NO'],['Lending/Credit marker',lending?'YES':'NO']];out.innerHTML='<div class="grid">'+rows.map(([k,v])=>'<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div>').join('')+'</div><div class="preview"><b>Content preview</b>\n\n'+esc(t.contentPreview||'(empty)')+'</div>'; }catch(e){status.innerHTML='<span class="bad">'+esc(e.message)+'</span>';}}run();</script></body></html>
