<rect x="82" y="58" width="750" height="88" rx="18" fill="#ffffff" stroke="#dde2eb"/><text x="103" y="95" fill="#172239" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">I looked at the numbers, and honestly $180 a month just feels like too much for</text><text x="103" y="125" fill="#172239" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">insurance.</text>
<text x="1010" y="183" fill="#79879b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">You</text><rect x="1028" y="196" width="44" height="44" rx="22" fill="#eef3ff" stroke="none"/><text x="1040" y="225" fill="#2257cc" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Y</text>
<rect x="261" y="189" width="749" height="88" rx="18" fill="#215bdc" stroke="none"/><text x="282" y="225" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">I understand $180 a month feels high. What monthly amount would feel</text><text x="282" y="254" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">manageable, and what would you most want this coverage to protect?</text>
<rect x="27" y="306" width="44" height="44" rx="22" fill="#fef0f0" stroke="none"/><text x="38" y="333" fill="#c83333" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">DA</text><text x="82" y="311" fill="#768096" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">AI Client</text>
<rect x="82" y="321" width="750" height="145" rx="18" fill="#ffffff" stroke="#dde2eb"/>
<text x="103" y="355" fill="#172239" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">That's actually a good question. I guess somewhere around $120-$130 would</text>
<text x="103" y="384" fill="#172239" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">feel more comfortable, but what I really care about is making sure my family's</text>
<text x="103" y="413" fill="#172239" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">taken care of if something happens to me — we've got a mortgage and two kids</text>
<text x="103" y="442" fill="#172239" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">in school. What exactly am I getting for that $180 that justifies the difference?</text>
