<title id="title">Practice Studio — one sourced fictional premium-objection session with all three coaching scores</title>
<desc id="desc">Source-faithful editorial re-render, not a raw browser capture. The AI client objects to 180 dollars per month; learner asks about manageable budget and desired protection; client asks how coverage justifies the difference. Overall score 82; empathy and rapport 80, product accuracy 72, closing technique 70.</desc>
<rect x="0" y="0" width="1520" height="691" rx="0" fill="#f6f7fb" stroke="none"/><rect x="1093" y="0" width="427" height="691" rx="0" fill="#ffffff" stroke="none"/><rect x="1092" y="0" width="2" height="691" rx="0" fill="#e5e7ef" stroke="none"/>
