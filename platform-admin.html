<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Admin — AgentTraining.ai</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>body{margin:0;background:#f7f8fc;color:#111827;font:14px Arial,sans-serif}.wrap{max-width:760px;margin:50px auto;padding:0 18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px}h1{color:#1a56db;margin-top:0}.note{color:#64748b;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:18px;background:#1a56db;color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.status{margin-top:16px;padding:12px;background:#f8fafc;border-radius:9px;white-space:pre-wrap;word-break:break-word}.link{margin-top:12px;padding:12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:9px;word-break:break-all}.copy{background:#fff;color:#1a56db;border:1px solid #93c5fd;margin-top:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>Platform Admin · Invite Manager</h1><p class="note">Only a signed-in Platform Admin can create a Manager invitation. Each Manager receives a separate team workspace and can then use the existing Invite Learner flow.</p><div class="grid"><div><label>Manager name</label><input id="name" placeholder="e.g. Jane Chen"></div><div><label>Manager email</label><input id="email" type="email" placeholder="manager@company.com"></div><div><label>Organization</label><input id="organization" placeholder="Company or team name"></div><div><label>Team ID</label><input id="team" placeholder="e.g. acme-pilot"></div></div><button id="create">Create Manager Invitation</button><div class="status" id="status">Sign in with the Platform Admin account to continue.</div><div id="result" hidden><div class="link" id="link"></div><button class="copy" id="copy">Copy Invite Link</button></div></section></main><script>const status=document.getElementById('status'),result=document.getElementById('result'),linkBox=document.getElementById('link');function roles(u){return u?.app_metadata?.roles||[]}function ready(){const u=netlifyIdentity.currentUser();if(!u){netlifyIdentity.open('login');return false}if(!roles(u).includes('admin')){status.textContent='This page requires the Platform Admin role.';return false}status.textContent='Platform Admin verified. Enter the new Manager details.';return true}netlifyIdentity.on('init',ready);netlifyIdentity.on('login',()=>{netlifyIdentity.close();ready()});netlifyIdentity.init();document.getElementById('create').onclick=async()=>{if(!ready())return;const u=netlifyIdentity.currentUser();status.textContent='Creating secure Manager invitation…';result.hidden=true;try{const token=await u.jwt();const body={name:document.getElementById('name').value,email:document.getElementById('email').value,organization:document.getElementById('organization').value,teamId:document.getElementById('team').value};const r=await fetch('/.netlify/functions/pilot-manager-invite?action=create',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not create invitation.');linkBox.textContent=d.link;result.hidden=false;status.textContent=d.reused?'Existing active invitation reused.':'Manager invitation created.'}catch(e){status.textContent=e.message}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(linkBox.textContent);status.textContent='Invite link copied.'};</script></body></html>
